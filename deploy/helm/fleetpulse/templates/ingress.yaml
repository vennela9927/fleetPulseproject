{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetpulse
  labels: {{- include "fleetpulse.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The web container proxies /api to the api service, as in docker compose.
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
          # OEM partners post telemetry straight to the gateway.
          - { path: /ingest, pathType: Prefix, backend: { service: { name: ingest-gateway, port: { number: 8081 } } } }
---
# Only the ingress controller reaches the edge services; everything else talks inside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetpulse-default
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: fleetpulse } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/part-of: fleetpulse } } }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
{{- end }}
