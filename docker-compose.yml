name: fleetpulse

# One command for the whole platform:   docker compose up -d --build
#   dashboard http://localhost:3000   (acme.manager / acme-demo-2026, see README)
# First run only, to get history and a trained model (see README, "Data"):
#   docker compose --profile setup run --rm backfill
#   docker compose --profile jobs run --rm ml fleetpulse-train
#   docker compose --profile jobs run --rm ml fleetpulse-score
# Data viewers (Kafka UI, Adminer, RedisInsight):  docker compose --profile tools up -d
#
# Memory limits add up to about 12 GB; the containers used about 5 GB in our 100K-vehicle run
# (Docker Desktop with 8 GB and 12 CPUs). On a smaller machine set SIM_VEHICLES=20000.

x-s3-env: &s3-env
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fleets3}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-fleets3_dev_secret}

# Spring Boot services expose /actuator/health; the JRE image has bash but no curl.
x-java-health: &java-health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

x-java-build: &java-build
  context: .
  dockerfile: services/Dockerfile.java

x-db-env: &db-env
  POSTGRES_URL: jdbc:postgresql://postgres:5432/fleet
  SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-fleet_service_dev}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev}
  KAFKA_BOOTSTRAP: kafka:9092

x-ml-env: &ml-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev}
  POSTGRES_DSN: postgresql://fleet_service:${SERVICE_DB_PASSWORD:-fleet_service_dev}@postgres:5432/fleet
  MODEL_DIR: /models

services:
  # ---------------------------------------------------------------- messaging
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      # The image defaults to /tmp, outside the volume: data would vanish with the container.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: 4
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      # One Kafka ApiVersions request from bash, checking the reply's correlation id and error code:
      # proves the broker serves requests, in milliseconds. A JVM-based probe (kafka-broker-api-versions.sh)
      # takes 20-30 s just to start on a busy laptop and timed out while the broker was fine.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9092
          && printf '\000\000\000\014\000\022\000\000\000\000\000\001\000\002hc' >&3
          && timeout 5 head -c 10 <&3 | od -An -tx1 | tr -d ' \n' | grep -qx '[0-9a-f]\{8\}000000010000'
      interval: 10s
      timeout: 10s
      retries: 12
      # After an unclean shutdown the broker re-reads its logs before serving: minutes, not seconds.
      start_period: 10m
      start_interval: 5s
    deploy: { resources: { limits: { memory: 1g } } }

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_REPLICATION: 1
    volumes: [./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro]
    restart: "no"

  # ---------------------------------------------------------------- storage
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_admin_dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-fleet_app_dev}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-fleet_service_dev}
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=128MB
               -c max_connections=200 -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_admin -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 768m } } }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]
    environment:
      <<: *s3-env
      CLICKHOUSE_DB: fleet
      CLICKHOUSE_USER: fleet
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-clickhouse_api_dev}   # read by init/02_api_access.sh
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_COLD_ENDPOINT: http://objectstore:8333/clickhouse-cold/
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    depends_on: { objectstore-init: { condition: service_completed_successfully } }
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 1536m } } }

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    # Live state is rebuildable from Kafka, so no persistence; evict nothing silently.
    command: redis-server --maxmemory 400mb --maxmemory-policy noeviction --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  # ---------------------------------------------------------------- identity
  # OIDC provider. The realm (tenants as groups, demo users, clients) is imported on start.
  # KC_HOSTNAME pins the token issuer to the browser-facing URL, so tokens verify the same
  # whether the API reaches Keycloak as localhost:8080 or keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm"]
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_dev}
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    volumes: [./infra/keycloak/fleetpulse-realm.json:/opt/keycloak/data/import/fleetpulse-realm.json:ro]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 768m } } }

  # S3-compatible object store (SeaweedFS). Stands in for AWS S3 / GCS / Azure Blob:
  # services only speak the S3 API, so switching clouds is a config change.
  objectstore:
    image: chrislusf/seaweedfs:latest
    ports: ["8333:8333"]
    environment: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"fleet","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
             -master.volumeSizeLimitMB=512 -volume.max=0 -ip.bind=0.0.0.0
    volumes: [object-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 768m } } }

  objectstore-init:
    image: amazon/aws-cli:2.17.50
    depends_on: { objectstore: { condition: service_healthy } }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fleets3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-fleets3_dev_secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do aws --endpoint-url http://objectstore:8333 s3 ls >/dev/null 2>&1 && break; sleep 2; done
        for b in clickhouse-cold telemetry-archive ml-artifacts; do
          aws --endpoint-url http://objectstore:8333 s3 mb s3://$$b 2>/dev/null || true
        done
        aws --endpoint-url http://objectstore:8333 s3 ls
    restart: "no"

  # ---------------------------------------------------------------- pipeline
  ingest-gateway:
    build: { <<: *java-build, args: { SERVICE: ingest-gateway } }
    image: fleetpulse/ingest-gateway
    ports: ["8081:8081"]
    environment: { KAFKA_BOOTSTRAP: kafka:9092 }
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    healthcheck:
      <<: *java-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^{\"status\":\"UP\"' <&3"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  normalizer:
    build: { <<: *java-build, args: { SERVICE: normalizer } }
    image: fleetpulse/normalizer
    ports: ["8082:8082"]
    # 24 partitions of telemetry.raw; two threads could not keep up with 100K vehicles on a 12-CPU laptop.
    # Half the limit for the heap: RocksDB (the dedup window) lives outside it. At 70% it was OOM-killed.
    environment: { KAFKA_BOOTSTRAP: kafka:9092, STREAM_THREADS: "${NORMALIZER_THREADS:-6}",
                   JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError" }
    volumes: [normalizer-state:/state]
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    healthcheck:
      <<: *java-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^{\"status\":\"UP\"' <&3"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536m } } }

  stream-processor:
    build: { <<: *java-build, args: { SERVICE: stream-processor } }
    image: fleetpulse/stream-processor
    ports: ["8083:8083"]
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379
      STREAM_THREADS: ${PROCESSOR_THREADS:-4}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError"
    # RocksDB state survives restarts, so recovery replays only the changelog tail.
    volumes: [stream-state:/state]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^{\"status\":\"UP\"' <&3"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536m } } }

  # Seeds 100K vehicles on first start (skipped afterwards), then streams live telemetry.
  simulator:
    build: { <<: *java-build, args: { SERVICE: simulator } }
    image: fleetpulse/simulator
    ports: ["8090:8090"]
    environment:
      <<: *db-env
      SIM_MODES: seed,run
      SIM_VEHICLES: ${SIM_VEHICLES:-100000}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-30}
      GATEWAY_URL: http://ingest-gateway:8081
    depends_on:
      ingest-gateway: { condition: service_healthy }
      normalizer: { condition: service_healthy }
      stream-processor: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1536m } } }

  # 21 days of history straight into ClickHouse, plus breakdown labels for the model. Once.
  backfill:
    image: fleetpulse/simulator
    profiles: [setup]
    environment:
      <<: *db-env
      SIM_MODES: seed,backfill
      SIM_BACKFILL_DAYS: ${SIM_BACKFILL_DAYS:-21}
      SIM_BACKFILL_THREADS: 2
      PORT: 0
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 2560m } } }
    restart: "no"

  # ---------------------------------------------------------------- product
  api:
    build: services/api
    image: fleetpulse/api
    ports: ["8000:8000"]
    # The image's probe starts a Python process: allow for a busy machine, where that alone took over 3 s.
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"], interval: 10s, timeout: 15s, retries: 12, start_period: 30s }
    environment:
      API_POSTGRES_DSN: postgresql://fleet_app:${APP_DB_PASSWORD:-fleet_app_dev}@postgres:5432/fleet
      API_REDIS_URL: redis://redis:6379/0
      API_CLICKHOUSE_URL: http://clickhouse:8123
      API_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-clickhouse_api_dev}
      # Tokens carry the browser-facing issuer (KC_HOSTNAME); keys are fetched over the internal network.
      API_OIDC_ISSUER: http://localhost:8080/realms/fleetpulse
      API_OIDC_JWKS_URL: http://keycloak:8080/realms/fleetpulse/protocol/openid-connect/certs
      API_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      API_SIMULATOR_URL: http://simulator:8090
      API_NORMALIZER_URL: http://normalizer:8082
      API_KAFKA_BOOTSTRAP: kafka:9092
      API_DEMO_CONTROLS: ${DEMO_CONTROLS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: warning
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  web:
    build: web
    image: fleetpulse/web
    ports: ["3000:8080"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64m } } }

  # Feed-drift check every two minutes (see ADR 0004).
  drift:
    build: services/ml
    image: fleetpulse/ml
    command: ["fleetpulse-drift", "--watch", "120"]
    environment: *ml-env
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: on-failure
    deploy: { resources: { limits: { memory: 768m } } }

  # One-off model jobs:  docker compose --profile jobs run --rm ml fleetpulse-train | fleetpulse-score | fleetpulse-evaluate
  ml:
    image: fleetpulse/ml
    profiles: [jobs]
    environment: *ml-env
    volumes: [ml-models:/models]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 3g } } }

  # ---------------------------------------------------------------- data viewers (profile: tools)
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    profiles: [tools]
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on: { kafka: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512m } } }

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    ports: ["8086:8080"]
    environment: { ADMINER_DEFAULT_SERVER: postgres }
    deploy: { resources: { limits: { memory: 128m } } }

  redisinsight:
    image: redis/redisinsight:2.60
    profiles: [tools]
    ports: ["5540:5540"]
    deploy: { resources: { limits: { memory: 384m } } }

volumes:
  kafka-data:
  pg-data:
  ch-data:
  object-data:
  normalizer-state:
  stream-state:
  ml-models:
