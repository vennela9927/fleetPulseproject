name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java services (unit and topology tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify

  api:
    name: API (lint, unit tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Integration tests need the compose stack; they skip themselves when it is not running.
      - run: uv run pytest -q -m "not integration"

  ml:
    name: ML (lint, feature, leakage and evaluation tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Security scans (secrets, dependencies, IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets in the whole history
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Vulnerable dependencies and misconfigured IaC (Dockerfiles, Helm, Terraform)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: [java, api, ml, web]
    strategy:
      matrix:
        include:
          - { name: ingest-gateway, context: ., file: services/Dockerfile.java, service: ingest-gateway }
          - { name: normalizer, context: ., file: services/Dockerfile.java, service: normalizer }
          - { name: stream-processor, context: ., file: services/Dockerfile.java, service: stream-processor }
          - { name: simulator, context: ., file: services/Dockerfile.java, service: simulator }
          - { name: api, context: services/api, file: services/api/Dockerfile }
          - { name: ml, context: services/ml, file: services/ml/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.service }}
          tags: fleetpulse/${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fleetpulse/${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  smoke:
    name: Whole stack starts (docker compose)
    runs-on: ubuntu-latest
    needs: [images]
    env: { SIM_VEHICLES: "5000" }
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 600
      - name: Every service healthy, the API answers, telemetry reaches storage
        run: |
          docker compose ps
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:3000/ >/dev/null
          for i in $(seq 1 30); do
            n=$(curl -fsS --user fleet:clickhouse_dev "http://localhost:8123/?query=SELECT%20count()%20FROM%20fleet.telemetry" || echo 0)
            [ "$n" -gt 0 ] && echo "telemetry rows: $n" && exit 0
            sleep 10
          done
          echo "no telemetry reached ClickHouse"; exit 1
      - if: failure()
        run: docker compose logs --tail 200
